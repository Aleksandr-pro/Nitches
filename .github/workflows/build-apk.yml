name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_to_release:
        description: 'Догрузить APK в черновик релиза (immutable-режим: сначала черновик, публикация — вручную после CI)'
        type: boolean
        default: false
      release_tag:
        description: 'Тег релиза для publish_to_release, например v0.6.1'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (runtime LFS assets are pulled explicitly below)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch and verify runtime Git LFS assets
        run: |
          git lfs version
          git lfs install --local
          # Do not download editable source packages from asset-source/ into
          # an APK build; only models that actually ship in public/ matter.
          git lfs pull --include="public/assets/models/**" --exclude=""
          git lfs ls-files
          node scripts/check-lfs-assets.mjs

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages (API 36)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Test cloud resource client
        run: npm test

      - name: Build web game
        env:
          VITE_ASSET_CDN_BASE_URL: ${{ vars.VITE_ASSET_CDN_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Generate signing key and sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          VERSION="$(node -p "require('./package.json').version")"
          OUT="NitchesHorizon-v${VERSION}.apk"

          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Используем постоянный ключ из секретов"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "Секретов нет — генерируем одноразовый ключ на раннере"
            KS_PASS="$(openssl rand -base64 24)"
            keytool -genkeypair -keystore "$KS" -alias nitches \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Nitches Horizon, O=ProfitNiche"
          fi
          export KS_PASS

          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS" --ks-key-alias nitches \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          ls -lh "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitchesHorizon-apk
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # Ручной запуск: грузим в ЧЕРНОВИК (в опубликованный immutable-релиз
          # догружать нельзя) — публикация черновика делается вручную после CI.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: ${{ env.APK_PATH }}
          name: Nitches Horizon ${{ inputs.release_tag || github.ref_name }} — Android APK
          fail_on_unmatched_files: true
          body: |
            ## 📱 Nitches Horizon для Android

            **⬇️ Скачай файл `NitchesHorizon-${{ inputs.release_tag || github.ref_name }}.apk` ниже (раздел Assets) и открой его на телефоне.**

            ### Установка
            1. Скачай APK (Android 7.0 и новее).
            2. Открой файл — если Android попросит, разреши «Установку из неизвестных источников».
            3. Нажми «Установить».

            ### Что нового в ${{ inputs.release_tag || github.ref_name }} — Festival Britain 4×4 км
            - 🗺️ Новая карта Британии 4×4 км вместо острова: 46,7 км дорог, 10 районов — фестиваль, город Kingsford, замок, озеро и горы, фермы, лес и карьер, побережье и аэродром
            - 🛣️ Настоящий масштаб 1 юнит = 1 м: магистрали, B-дороги и грунтовки с перепадами высот, 12 типов покрытий (асфальт, грунт, гравий, вереск, песок, вода…)
            - 🌄 Стриминг мира чанками 250 м с LOD: горы Snowdonia-like на северо-западе видны за километры
            - 🚗 Пока это свободная поездка по всей карте (дрифт и нитро на месте); гонки, трафик и соперники переедут на новую карту следующим этапом. Старый остров с гонками доступен при запуске с параметром ?world=legacy в веб-версии
            - 🐎 Сохранено всё из v0.5.0: Mustang Fastback GLB, GT-R35, шинная физика v2.1, шоурум

            > ⚠️ Подпись CI. Если не встаёт поверх — удали старую версию.
