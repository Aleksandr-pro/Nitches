name: Model Inbox inventory

# Phone-first import step: a large model ZIP is uploaded to the draft GitHub
# Release "Model Inbox", then a small JSON manifest in asset-inbox/imports/
# tells this workflow which release asset to inspect. The workflow never
# executes archive contents; it commits only inventory.md/json reports back to
# the same non-main branch so a human/agent can decide what belongs in Git LFS
# and what must be converted/optimized first.
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'asset-inbox/imports/*.json'
      - '.github/workflows/model-inbox-inventory.yml'
      - 'scripts/inventory-model-archive.py'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest path, e.g. asset-inbox/imports/mustang.json'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: model-inbox-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Download Model Inbox asset and inventory it
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE_SHA: ${{ github.event.before }}
      INPUT_MANIFEST: ${{ inputs.manifest }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout branch (no LFS bandwidth needed for inventory)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select import manifests
        run: |
          set -euo pipefail
          MANIFESTS=()
          if [ -n "${INPUT_MANIFEST}" ]; then
            MANIFESTS=("${INPUT_MANIFEST}")
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t MANIFESTS < <(git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'asset-inbox/imports/*.json')
          fi
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            mapfile -t MANIFESTS < <(find asset-inbox/imports -maxdepth 1 -type f -name '*.json' | sort)
          fi
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No import manifests found" >&2
            exit 1
          fi
          printf '%s\n' "${MANIFESTS[@]}" | tee "$RUNNER_TEMP/manifests.txt"

      - name: Download and inventory selected Model Inbox assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-inbox"
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            case "$manifest" in
              asset-inbox/imports/*.json) ;;
              *) echo "Refusing unexpected manifest path: $manifest" >&2; exit 1 ;;
            esac
            test -f "$manifest"

            car_id="$(jq -r '.carId' "$manifest")"
            release_id="$(jq -r '.releaseId' "$manifest")"
            asset_id="$(jq -r '.assetId' "$manifest")"
            asset_name="$(jq -r '.assetName' "$manifest")"
            expected_size="$(jq -r '.expectedSize // 0' "$manifest")"

            if ! [[ "$car_id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid carId in $manifest: $car_id" >&2
              exit 1
            fi
            if ! [[ "$release_id" =~ ^[0-9]+$ && "$asset_id" =~ ^[0-9]+$ && "$expected_size" =~ ^[0-9]+$ ]]; then
              echo "releaseId, assetId and expectedSize must be numeric in $manifest" >&2
              exit 1
            fi
            case "$asset_name" in
              */*|*\\*) echo "assetName must be a plain file name: $asset_name" >&2; exit 1 ;;
            esac

            archive="$RUNNER_TEMP/model-inbox/$asset_name"
            echo "Downloading release asset $asset_id ($asset_name) for $car_id..."
            curl --fail --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -o "$archive"

            actual_size="$(stat -c '%s' "$archive")"
            echo "Downloaded $actual_size bytes"
            if [ "$expected_size" != "0" ] && [ "$actual_size" != "$expected_size" ]; then
              echo "Size mismatch for $asset_name: expected $expected_size, got $actual_size" >&2
              exit 1
            fi
            sha256sum "$archive"

            python3 scripts/inventory-model-archive.py "$archive" \
              --out-dir "asset-inbox/imports/$car_id" \
              --car-id "$car_id" \
              --release-id "$release_id" \
              --asset-id "$asset_id" \
              --expected-size "$expected_size"
          done < "$RUNNER_TEMP/manifests.txt"

      - name: Upload inventory reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-inbox-inventory-${{ github.sha }}
          path: asset-inbox/imports/**/inventory.*
          if-no-files-found: error
          retention-days: 30

      - name: Commit inventory reports back to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-inbox/imports
          if git diff --cached --quiet; then
            echo "Inventory reports are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(assets): inventory Model Inbox import"
          git push origin "HEAD:${BRANCH}"
