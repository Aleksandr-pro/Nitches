name: Deploy Nitches Server (Cloudflare)

# One-tap server deploy from a phone: add the two Cloudflare secrets
# (repo Settings -> Secrets and variables -> Actions), then run this
# workflow from the Actions tab.  It creates the D1 player database if
# needed, applies schema.sql, deploys the Worker and prints the server
# URL into the run summary.  Full guide: server/README.md

on:
  workflow_dispatch:
    inputs:
      init_db:
        description: 'Create D1 database if needed and apply schema.sql (safe to re-run)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secrets. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings -> Secrets and variables -> Actions. Step-by-step guide: server/README.md"
            exit 1
          fi

      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database and inject its id into wrangler.toml
        run: |
          set -e
          find_db() {
            npx wrangler d1 list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const a=JSON.parse(d);const m=a.find(x=>x.name==='nitches-db');console.log(m?m.uuid:'')}catch(e){console.log('')}})"
          }
          DB_ID=$(find_db)
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database nitches-db..."
            npx wrangler d1 create nitches-db
            DB_ID=$(find_db)
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not find or create the D1 database - check the API token permissions (Edit Cloudflare Workers template includes D1)."
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$DB_ID/" wrangler.toml

      - name: Apply database schema
        if: ${{ inputs.init_db }}
        run: npx wrangler d1 execute nitches-db --remote --file=schema.sql

      - name: Deploy worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          {
            echo "## Nitches server deployed"
            echo ""
            if [ -n "$URL" ]; then
              echo "**Server URL for the game:** \`$URL\`"
              echo ""
              echo "1. In the game open the **Online** tab and paste this URL into the server address field."
              echo "2. Tap **Registration** and register FIRST - the first player becomes the developer (admin panel at the bottom of the Online tab)."
              echo "3. Privacy policy: $URL/privacy"
            else
              echo "Deploy finished, but the workers.dev URL was not found automatically - open the 'Deploy worker' step log above and copy the URL from there."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
