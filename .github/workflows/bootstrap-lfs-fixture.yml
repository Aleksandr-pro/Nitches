name: Bootstrap LFS pipeline fixture (temporary)

# One-off sandbox workaround: the development sandbox can negotiate with the
# GitHub LFS API but cannot PUT bytes to the signed S3 endpoint. This runner
# regenerates the deterministic fixture and uploads that one object with the
# real git-lfs client. Remove this workflow after it has succeeded once.
on:
  push:
    branches:
      - 'arena/5a598c9a-nitches'
    paths:
      - '.gitattributes'
      - '.github/workflows/bootstrap-lfs-fixture.yml'
      - 'scripts/generate-pipeline-smoke-glb.mjs'
      - 'public/assets/models/_pipeline/pipeline-smoke.glb'

permissions:
  contents: write

jobs:
  upload-fixture-object:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIXTURE: public/assets/models/_pipeline/pipeline-smoke.glb
      OID: ef0cfdde9359d20e52c587feb529db368c73d736c1d1853348359c23df8d094e
    steps:
      - name: Checkout pointer without LFS smudge
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate, upload and redownload the LFS object
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          POINTER_COMMITTED=0
          if git ls-files --error-unmatch "$FIXTURE" >/dev/null 2>&1; then
            POINTER_COMMITTED=1
            echo "Committed pointer:"
            cat "$FIXTURE"
            grep -qx "oid sha256:$OID" "$FIXTURE"
          else
            echo "Pointer is not committed yet: uploading the object first, as required by GitHub's pre-receive LFS check."
          fi

          node scripts/generate-pipeline-smoke-glb.mjs "$FIXTURE"
          test "$(sha256sum "$FIXTURE" | awk '{print $1}')" = "$OID"

          # The clean filter stores the real object in .git/lfs/objects.
          git add "$FIXTURE"
          git lfs ls-files
          git lfs push --object-id origin "$OID"

          if [ "$POINTER_COMMITTED" = "1" ]; then
            # Prove the bytes now come back from GitHub LFS, not the local cache.
            OBJECT_PATH=".git/lfs/objects/${OID:0:2}/${OID:2:2}/$OID"
            rm -f "$FIXTURE" "$OBJECT_PATH"
            git checkout -- "$FIXTURE" || true
            git lfs pull --include="$FIXTURE" --exclude=""
            test "$(sha256sum "$FIXTURE" | awk '{print $1}')" = "$OID"
            node scripts/check-lfs-assets.mjs
          else
            node scripts/check-lfs-assets.mjs
            echo "Object uploaded. The following commit adds its pointer and clean CI verifies the download."
          fi
