name: Model Inbox city convert

# Converts a standalone city FBX from the draft GitHub Release "Model Inbox"
# into a chunked runtime GLB plus generated city-local collider data.
# The source FBX and runtime GLB are uploaded to Git LFS from this runner;
# only LFS pointers, generated data and reports are committed to the branch.
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'asset-inbox/city-conversions/*.json'
      - '.github/workflows/model-inbox-city-convert.yml'
      - 'scripts/blender_convert_city.py'
      - 'scripts/check-lfs-assets.mjs'
      - 'scripts/validate-glb-loader.mjs'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'City conversion manifest, e.g. asset-inbox/city-conversions/kingsford-manhattan-city.json'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: model-inbox-city-convert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    name: Convert Model Inbox city to chunked GLB
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE_SHA: ${{ github.event.before }}
      INPUT_MANIFEST: ${{ inputs.manifest }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout branch (LFS pulled explicitly when needed)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy jq
          blender --version

      - name: Select city conversion manifests
        run: |
          set -euo pipefail
          MANIFESTS=()
          if [ -n "${INPUT_MANIFEST}" ]; then
            MANIFESTS=("${INPUT_MANIFEST}")
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t MANIFESTS < <(git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- 'asset-inbox/city-conversions/*.json')
          fi
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            mapfile -t MANIFESTS < <(find asset-inbox/city-conversions -maxdepth 1 -type f -name '*.json' | sort)
          fi
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No city conversion manifests found" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/model-city-convert"
          printf '%s\n' "${MANIFESTS[@]}" | tee "$RUNNER_TEMP/model-city-convert/manifests.txt"

      - name: Download and convert selected cities
        run: |
          set -euo pipefail
          CONVERT_ROOT="$RUNNER_TEMP/model-city-convert"
          mkdir -p "$CONVERT_ROOT"
          exec > >(tee -a "$CONVERT_ROOT/download-convert-step.log") 2>&1
          : > "$CONVERT_ROOT/outputs.tsv"

          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            case "$manifest" in
              asset-inbox/city-conversions/*.json) ;;
              *) echo "Refusing unexpected manifest path: $manifest" >&2; exit 1 ;;
            esac
            test -f "$manifest"

            asset_key="$(jq -r '.assetKey' "$manifest")"
            display_name="$(jq -r '.displayName // .assetKey' "$manifest")"
            release_id="$(jq -r '.releaseId' "$manifest")"
            asset_id="$(jq -r '.assetId' "$manifest")"
            asset_name="$(jq -r '.assetName' "$manifest")"
            expected_size="$(jq -r '.expectedSize // 0' "$manifest")"
            expected_sha="$(jq -r '.expectedSha256 // ""' "$manifest")"
            scale_xy="$(jq -r '.conversion.scaleXYMPerUnit // 250' "$manifest")"
            scale_z="$(jq -r '.conversion.scaleZMPerUnit // 230' "$manifest")"
            ground_source_z="$(jq -r '.conversion.groundSourceZ // 0.008' "$manifest")"
            target_triangles="$(jq -r '.conversion.targetTriangles // 340000' "$manifest")"
            chunk_size="$(jq -r '.conversion.chunkSizeM // 250' "$manifest")"
            collider_cell_size="$(jq -r '.conversion.colliderCellSizeM // 4' "$manifest")"
            obstacle_height="$(jq -r '.conversion.obstacleHeightM // 2' "$manifest")"
            root_name="$(jq -r '.conversion.rootName // "KingsfordManhattanCity"' "$manifest")"
            runtime_dest="$(jq -r '.outputs.runtimeGlb' "$manifest")"
            source_dest="$(jq -r '.outputs.sourceModel' "$manifest")"
            generated_dest="$(jq -r '.outputs.generatedData' "$manifest")"
            report_dir="$(jq -r '.outputs.reportDir' "$manifest")"

            if ! [[ "$asset_key" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid assetKey in $manifest: $asset_key" >&2
              exit 1
            fi
            if ! [[ "$release_id" =~ ^[0-9]+$ && "$asset_id" =~ ^[0-9]+$ && "$expected_size" =~ ^[0-9]+$ && "$target_triangles" =~ ^[0-9]+$ ]]; then
              echo "releaseId, assetId, expectedSize and targetTriangles must be numeric in $manifest" >&2
              exit 1
            fi
            if [ -n "$expected_sha" ] && ! [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "expectedSha256 must be lowercase SHA-256 in $manifest" >&2
              exit 1
            fi
            for numeric_value in "$scale_xy" "$scale_z" "$ground_source_z" "$chunk_size" "$collider_cell_size" "$obstacle_height"; do
              if ! [[ "$numeric_value" =~ ^-?[0-9]+([.][0-9]+)?$ ]]; then
                echo "Invalid numeric conversion value in $manifest: $numeric_value" >&2
                exit 1
              fi
            done
            if ! [[ "$root_name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
              echo "Invalid rootName in $manifest: $root_name" >&2
              exit 1
            fi
            case "$asset_name" in
              */*|*\\*) echo "assetName must be a plain file name: $asset_name" >&2; exit 1 ;;
            esac
            case "$runtime_dest" in
              public/assets/models/cities/$asset_key/*.glb) ;;
              *) echo "runtimeGlb must be under public/assets/models/cities/$asset_key/: $runtime_dest" >&2; exit 1 ;;
            esac
            case "$source_dest" in
              asset-source/cities/$asset_key/*.fbx) ;;
              *) echo "sourceModel must be an FBX under asset-source/cities/$asset_key/: $source_dest" >&2; exit 1 ;;
            esac
            case "$generated_dest" in
              src/world/manhattanCityData.js) ;;
              *) echo "generatedData must be src/world/manhattanCityData.js for this pipeline: $generated_dest" >&2; exit 1 ;;
            esac
            case "$report_dir" in
              asset-inbox/city-conversions/$asset_key) ;;
              *) echo "reportDir must be asset-inbox/city-conversions/$asset_key: $report_dir" >&2; exit 1 ;;
            esac
            for output_path in "$runtime_dest" "$source_dest" "$generated_dest" "$report_dir"; do
              case "$output_path" in
                /*|*\\*|../*|*/../*) echo "Unsafe output path in $manifest: $output_path" >&2; exit 1 ;;
              esac
            done

            work="$CONVERT_ROOT/$asset_key"
            generated_dir="$work/generated"
            mkdir -p "$work" "$generated_dir"
            source_file="$work/$asset_name"
            generated_glb="$generated_dir/$asset_key.glb"
            generated_data="$generated_dir/manhattanCityData.js"
            conversion_report="$work/conversion.json"
            conversion_markdown="$work/conversion.md"
            occupancy_svg="$work/occupancy.svg"
            loader_validation="$work/loader-validation.json"
            blender_log="$work/blender-convert.log"

            echo "Downloading Model Inbox asset $asset_id ($asset_name) for $asset_key..."
            curl --fail --location --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -o "$source_file"

            actual_size="$(stat -c '%s' "$source_file")"
            actual_sha="$(sha256sum "$source_file" | awk '{print $1}')"
            echo "Downloaded $actual_size bytes, sha256 $actual_sha"
            if [ "$expected_size" != "0" ] && [ "$actual_size" != "$expected_size" ]; then
              echo "Size mismatch for $asset_name: expected $expected_size, got $actual_size" >&2
              exit 1
            fi
            if [ -n "$expected_sha" ] && [ "$actual_sha" != "$expected_sha" ]; then
              echo "SHA-256 mismatch for $asset_name: expected $expected_sha, got $actual_sha" >&2
              exit 1
            fi

            echo "Converting $asset_name into a chunked, textureless city GLB..."
            timeout 45m blender -b --factory-startup -noaudio \
              --python scripts/blender_convert_city.py -- \
              --input "$source_file" \
              --output-glb "$generated_glb" \
              --output-data-js "$generated_data" \
              --report-json "$conversion_report" \
              --report-md "$conversion_markdown" \
              --output-svg "$occupancy_svg" \
              --asset-key "$asset_key" \
              --display-name "$display_name" \
              --root-name "$root_name" \
              --scale-xy "$scale_xy" \
              --scale-z "$scale_z" \
              --ground-source-z "$ground_source_z" \
              --target-triangles "$target_triangles" \
              --chunk-size "$chunk_size" \
              --collider-cell-size "$collider_cell_size" \
              --obstacle-height-m "$obstacle_height" \
              2>&1 | tee "$blender_log"

            test -s "$generated_glb"
            test -s "$generated_data"
            test -s "$conversion_report"
            test -s "$conversion_markdown"
            test -s "$occupancy_svg"
            node scripts/validate-glb-loader.mjs --generic "$generated_glb" > "$loader_validation"

            triangles="$(jq -r '.stats.outputTriangles' "$conversion_report")"
            output_bytes="$(jq -r '.stats.glbBytes' "$conversion_report")"
            echo "Generated city GLB: $output_bytes bytes, about $triangles triangles"
            if [ "$triangles" -gt 450000 ]; then
              echo "Optimized city GLB still has too many triangles: $triangles" >&2
              exit 1
            fi
            if [ "$output_bytes" -gt 125829120 ]; then
              echo "Optimized city GLB is larger than 120 MiB: $output_bytes" >&2
              exit 1
            fi
            # generated_data is a JS module, so validate its payload through the JSON report
            # and the independently parsed GLB instead of trying to jq-parse JavaScript.
            jq -e '
              .stats.outputTriangles > 0 and
              (.colliders.rectangles | length > 0) and
              (.chunks | length > 0)
            ' "$conversion_report" >/dev/null
            jq -e '
              .mode == "generic" and
              .meshes > 0 and
              .meshesWithVertexColors == .meshes and
              .triangles > 0 and
              .triangles <= 450000 and
              .gltf.images == 0 and
              .gltf.textures == 0 and
              .bounds.sizeXYZ[0] > 1000 and
              .bounds.sizeXYZ[1] > 40 and
              .bounds.sizeXYZ[2] > 800
            ' "$loader_validation" >/dev/null

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$asset_key" "$source_file" "$generated_glb" "$generated_data" \
              "$conversion_report" "$conversion_markdown" "$occupancy_svg" "$loader_validation" "$blender_log" \
              "$runtime_dest" "$source_dest" "$generated_dest" "$report_dir" \
              >> "$CONVERT_ROOT/outputs.tsv"
          done < "$CONVERT_ROOT/manifests.txt"

      - name: Copy outputs, validate, upload to LFS and verify redownload
        run: |
          set -euo pipefail
          CONVERT_ROOT="$RUNNER_TEMP/model-city-convert"
          test -s "$CONVERT_ROOT/outputs.tsv"

          git lfs version
          git lfs install --local
          git lfs pull --include="public/assets/models/**" --exclude=""

          : > "$CONVERT_ROOT/verify.tsv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS=$'\t' read -r asset_key source_file generated_glb generated_data conversion_report conversion_markdown occupancy_svg loader_validation blender_log runtime_dest source_dest generated_dest report_dir; do
            mkdir -p \
              "$(dirname "$runtime_dest")" \
              "$(dirname "$source_dest")" \
              "$(dirname "$generated_dest")" \
              "$report_dir"

            cp "$generated_glb" "$runtime_dest"
            cp "$source_file" "$source_dest"
            cp "$generated_data" "$generated_dest"
            cp "$conversion_report" "$report_dir/conversion.json"
            cp "$conversion_markdown" "$report_dir/conversion.md"
            cp "$occupancy_svg" "$report_dir/occupancy.svg"
            tail -n 1000 "$blender_log" > "$report_dir/blender-convert.log"
            node scripts/validate-glb-loader.mjs --generic "$runtime_dest" > "$report_dir/loader-validation.json"

            printf '%s\t%s\n' "$runtime_dest" "$(sha256sum "$runtime_dest" | awk '{print $1}')" >> "$CONVERT_ROOT/verify.tsv"
            printf '%s\t%s\n' "$source_dest" "$(sha256sum "$source_dest" | awk '{print $1}')" >> "$CONVERT_ROOT/verify.tsv"

            git add \
              "$runtime_dest" \
              "$source_dest" \
              "$generated_dest" \
              "$report_dir/conversion.json" \
              "$report_dir/conversion.md" \
              "$report_dir/occupancy.svg" \
              "$report_dir/loader-validation.json" \
              "$report_dir/blender-convert.log"
          done < "$CONVERT_ROOT/outputs.tsv"

          node scripts/check-lfs-assets.mjs

          if git diff --cached --quiet; then
            echo "Converted city outputs are unchanged; nothing to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "feat(world): import Manhattan city GLB for Kingsford"
          git lfs ls-files
          git lfs push origin HEAD

          include_list="$(cut -f1 "$CONVERT_ROOT/verify.tsv" | paste -sd, -)"
          while IFS=$'\t' read -r path expected_sha; do
            rm -f "$path"
            rm -f ".git/lfs/objects/${expected_sha:0:2}/${expected_sha:2:2}/${expected_sha}"
          done < "$CONVERT_ROOT/verify.tsv"
          git lfs pull --include="$include_list" --exclude=""
          while IFS=$'\t' read -r path expected_sha; do
            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Redownloaded LFS object mismatch for $path: $actual_sha != $expected_sha" >&2
              exit 1
            fi
            echo "Verified LFS redownload: $path ($actual_sha)"
          done < "$CONVERT_ROOT/verify.tsv"

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Working tree is not clean after LFS redownload verification" >&2
            exit 1
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Upload conversion logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-inbox-city-conversion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/model-city-convert/**/blender-convert.log
            ${{ runner.temp }}/model-city-convert/**/conversion.json
            ${{ runner.temp }}/model-city-convert/**/conversion.md
            ${{ runner.temp }}/model-city-convert/**/occupancy.svg
            ${{ runner.temp }}/model-city-convert/**/loader-validation.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit conversion failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          CONVERT_ROOT="$RUNNER_TEMP/model-city-convert"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          manifests_file="$CONVERT_ROOT/manifests.txt"
          if [ ! -s "$manifests_file" ]; then
            mkdir -p "$CONVERT_ROOT"
            find asset-inbox/city-conversions -maxdepth 1 -type f -name '*.json' | sort > "$manifests_file"
          fi

          diag_paths=()
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            [ -f "$manifest" ] || continue
            asset_key="$(jq -r '.assetKey // "unknown-city"' "$manifest")"
            report_dir="$(jq -r '.outputs.reportDir // "asset-inbox/city-conversions/unknown-city"' "$manifest")"
            case "$report_dir" in
              asset-inbox/city-conversions/*) ;;
              *) report_dir="asset-inbox/city-conversions/$asset_key" ;;
            esac
            work="$CONVERT_ROOT/$asset_key"
            report="$report_dir/conversion-failure.md"
            mkdir -p "$report_dir"
            {
              echo "# City conversion failure diagnostics: $asset_key"
              echo
              echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "Commit: ${GITHUB_SHA}"
              echo
              for log in \
                "$CONVERT_ROOT/download-convert-step.log" \
                "$work/blender-convert.log" \
                "$work/conversion.json" \
                "$work/conversion.md" \
                "$work/loader-validation.json"; do
                if [ -s "$log" ]; then
                  echo "## ${log#$CONVERT_ROOT/}"
                  echo
                  echo '```text'
                  tail -n 500 "$log" | sed 's/```/``\x60/g'
                  echo '```'
                  echo
                fi
              done
            } > "$report"
            diag_paths+=("$report")
          done < "$manifests_file"

          if [ "${#diag_paths[@]}" -eq 0 ]; then
            echo "No diagnostics to commit"
            exit 0
          fi
          git add "${diag_paths[@]}"
          if git diff --cached --quiet; then
            echo "Diagnostics are unchanged"
            exit 0
          fi
          git commit -m "chore(world): add city conversion failure diagnostics"
          git push origin "HEAD:${BRANCH}"
