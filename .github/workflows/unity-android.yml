name: "Unity: build Android + Windows"

# Manual GameCI builds for the Unity port (folder unity/).
# Requires the one-time license setup in unity/CI_SETUP_RU.md.
# Without UNITY_LICENSE the license-check job explains what to do
# and the build is skipped (green, not red).
# The shipping Godot builds are unaffected by this workflow.

on:
  workflow_dispatch: {}

env:
  UNITY_VERSION: 6000.3.0f1
  PROJECT_PATH: unity

jobs:
  license-check:
    name: Check Unity license secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check for UNITY_LICENSE secret
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity license secret present, builds will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Unity license not configured yet"
              echo "CI builds are skipped. One-time setup:"
              echo "1. Run workflow 'Unity: request activation file' and download the .alf."
              echo "2. Exchange it for a .ulf at https://license.unity3d.com/manual"
              echo "3. Add secrets UNITY_LICENSE (full .ulf contents), UNITY_EMAIL, UNITY_PASSWORD."
              echo "Details: unity/CI_SETUP_RU.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: license-check
    if: needs.license-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android
          - StandaloneWindows64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free disk space (Android toolchains are large)
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Sync car models and audio banks into StreamingAssets
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-unity-assets.mjs

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-unity-${{ matrix.targetPlatform }}-${{ env.UNITY_VERSION }}
          restore-keys: Library-unity-

      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: NitchesHorizon
          versioning: None
          allowDirtyBuild: true
          androidExportType: androidPackage

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NitchesHorizon-unity-${{ matrix.targetPlatform }}
          path: ${{ env.PROJECT_PATH }}/build
          if-no-files-found: error
