name: Build Native Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'native/**'
      - 'scripts/export-native-world.mjs'
      - 'scripts/sync-native-assets.mjs'
      - 'scripts/validate-native-project.mjs'
      - 'scripts/check-lfs-assets.mjs'
      - 'src/world/realWorld.js'
      - 'src/assets/models/**'
      - 'src/assets/textures/realworld/**'
      - 'public/assets/models/**'
      - '.github/workflows/native-godot-android.yml'

permissions:
  contents: read

concurrency:
  group: native-godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_STATUS: 'stable'
  PROJECT_PATH: native
  APK_PATH: native/build/android/NitchesHorizonNative.apk

jobs:
  build-native-apk:
    name: Godot 4 native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (LFS runtime model is pulled explicitly)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and verify the Mustang LFS model
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          git lfs pull --include="public/assets/models/**" --exclude=""
          git lfs ls-files
          node scripts/check-lfs-assets.mjs

      - name: Generate native world data and stage Godot assets
        run: |
          set -euo pipefail
          node scripts/export-native-world.mjs
          node scripts/sync-native-assets.mjs
          node scripts/validate-native-project.mjs --require-assets

      - name: Setup Java 17 (required by the Godot Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nitches-godot/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-x86_64-v1

      - name: Download official Godot editor and export templates
        run: |
          set -euo pipefail
          GODOT_DIR="$HOME/.cache/nitches-godot/$GODOT_VERSION"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"

          if [ ! -x "$GODOT_BIN" ]; then
            curl -fL --retry 3 --output "$RUNNER_TEMP/godot-editor.zip" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q -o "$RUNNER_TEMP/godot-editor.zip" -d "$GODOT_DIR"
            chmod +x "$GODOT_BIN"
          fi

          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            curl -fL --retry 3 --output "$RUNNER_TEMP/godot-templates.tpz" \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/godot-templates"
            mkdir -p "$RUNNER_TEMP/godot-templates"
            unzip -q -o "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
            cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          fi

          "$GODOT_BIN" --headless --version
          test -f "$TEMPLATE_DIR/android_release.apk"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK/JDK paths
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          # Let Godot create a valid editor-settings resource first.
          "$GODOT_BIN" --headless --editor --path "$PROJECT_PATH" --quit >/dev/null 2>&1 || true
          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = Path.home() / ".config" / "godot" / "editor_settings-4.tres"
          settings.parent.mkdir(parents=True, exist_ok=True)
          text = settings.read_text(encoding="utf-8") if settings.exists() else ""
          if "[resource]" not in text:
              text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + text
          values = {
              "export/android/android_sdk_path": os.environ.get("ANDROID_SDK_ROOT", ""),
              "export/android/java_sdk_path": os.environ.get("JAVA_HOME", ""),
          }
          lines = text.splitlines()
          seen = set()
          output = []
          for line in lines:
              replaced = False
              for key, value in values.items():
                  if line.startswith(key + " ="):
                      output.append(f'{key} = "{value}"')
                      seen.add(key)
                      replaced = True
                      break
              if not replaced:
                  output.append(line)
          insert_at = output.index("[resource]") + 1
          for key, value in values.items():
              if key not in seen:
                  output.insert(insert_at, f'{key} = "{value}"')
                  insert_at += 1
          settings.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Configured {settings}")
          PY
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.tres"

      - name: Prepare Android signing key (secret or one-time CI key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/nitches-native-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            SIGNING_MODE="persistent-secret"
            echo "Using the persistent Android signing key from repository secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
          else
            SIGNING_MODE="one-time-ci-key"
            echo "Signing secrets are absent; generating a one-time CI key"
            KS_PASS="$(openssl rand -base64 24)"
            keytool -genkeypair -keystore "$KS" -alias nitches \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Nitches Horizon, O=ProfitNiche"
          fi
          echo "::add-mask::$KS_PASS"
          echo "APK_SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          echo "::notice title=APK signing mode::$SIGNING_MODE"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=nitches"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"

      - name: Import Godot project and run strict source smoke test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-logs"
          "$GODOT_BIN" --headless --path "$PROJECT_PATH" --import --quit \
            2>&1 | tee "$RUNNER_TEMP/native-logs/import.log"
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_PATH" \
            -- --native-smoke 2>&1 | tee "$RUNNER_TEMP/native-logs/source-smoke.log"
          grep -F "[native-smoke] PASS" "$RUNNER_TEMP/native-logs/source-smoke.log"
          if grep -E "SCRIPT ERROR|\[native-smoke\] FAIL|Native world data is missing|Native world failed to build" "$RUNNER_TEMP/native-logs/source-smoke.log"; then
            echo "Native source smoke reported a fatal runtime problem" >&2
            exit 1
          fi

      - name: Verify exported data pack without the source tree
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/native-pack-test"
          PACK_PATH="$PACK_DIR/NitchesHorizonNative.pck"
          mkdir -p "$PACK_DIR"
          "$GODOT_BIN" --headless --path "$PROJECT_PATH" \
            --export-pack Android "$PACK_PATH" \
            2>&1 | tee "$RUNNER_TEMP/native-logs/export-pack.log"
          test -s "$PACK_PATH"
          (
            cd "$PACK_DIR"
            timeout 120 "$GODOT_BIN" --headless --main-pack ./NitchesHorizonNative.pck \
              -- --native-smoke
          ) 2>&1 | tee "$RUNNER_TEMP/native-logs/pack-smoke.log"
          grep -F "[native-smoke] PASS" "$RUNNER_TEMP/native-logs/pack-smoke.log"
          if grep -E "SCRIPT ERROR|\[native-smoke\] FAIL|Native world data is missing|Native world failed to build" "$RUNNER_TEMP/native-logs/pack-smoke.log"; then
            echo "Exported Godot pack is missing runtime data or reported a fatal problem" >&2
            exit 1
          fi

      - name: Publish native smoke diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          log_dir = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "native-logs"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          markers = (
              "[native] RichTown build stats:",
              "[native-smoke]",
              "SCRIPT ERROR",
              "ERROR:",
              "Native world",
              "Mustang GLB",
              "Native texture is missing",
              "Native model is missing",
          )

          def annotation_escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n## Native Godot smoke diagnostics\n\n")
              if not log_dir.exists():
                  summary.write("No native smoke logs were produced.\n")
              for log_path in sorted(log_dir.glob("*.log")):
                  lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
                  selected = [line for line in lines if any(marker in line for marker in markers)]
                  if not selected:
                      selected = lines[-40:]
                  summary.write(f"### {log_path.name}\n\n```text\n")
                  summary.write("\n".join(selected[-80:]))
                  summary.write("\n```\n\n")
                  for line in selected:
                      if "[native-smoke] FAIL" in line or "SCRIPT ERROR" in line or "Native world" in line:
                          print(f"::error title=Native smoke {log_path.name}::{annotation_escape(line[:900])}")
                      elif "[native-smoke] PASS" in line or "[native] RichTown build stats:" in line:
                          print(f"::notice title=Native smoke {log_path.name}::{annotation_escape(line[:900])}")
          PY

      - name: Export signed native Android APK
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          "$GODOT_BIN" --headless --path "$PROJECT_PATH" \
            --export-release Android build/android/NitchesHorizonNative.apk
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Verify APK signature and native Godot ARM64 library
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1)"
          "$BT/aapt2" dump badging "$APK_PATH" | tee "$RUNNER_TEMP/apk-badging.txt"
          PACKAGE_LINE="$(grep -m1 '^package:' "$RUNNER_TEMP/apk-badging.txt" || true)"
          SDK_LINE="$(grep -m1 '^sdkVersion:' "$RUNNER_TEMP/apk-badging.txt" || true)"
          NATIVE_CODE_LINE="$(grep -m1 '^native-code:' "$RUNNER_TEMP/apk-badging.txt" || true)"
          echo "::notice title=APK install metadata::mode=${APK_SIGNING_MODE:-unknown} cert_sha256=$CERT_SHA256 $PACKAGE_LINE $SDK_LINE $NATIVE_CODE_LINE"
          {
            echo "## Native APK install metadata"
            echo ""
            echo "- Signing mode: ${APK_SIGNING_MODE:-unknown}"
            echo "- Signer certificate SHA-256: $CERT_SHA256"
            echo "- $PACKAGE_LINE"
            echo "- $SDK_LINE"
            echo "- $NATIVE_CODE_LINE"
          } >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK_PATH" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -F "lib/arm64-v8a/libgodot_android.so" "$RUNNER_TEMP/apk-contents.txt"
          grep -F "assets/data/richtown_native.json" "$RUNNER_TEMP/apk-contents.txt"
          grep -Ei "mustang.*\.scn" "$RUNNER_TEMP/apk-contents.txt"
          if grep -Ei "(^|/)(index\.html|capacitor|www/)" "$RUNNER_TEMP/apk-contents.txt"; then
            echo "Unexpected web wrapper payload found in native APK" >&2
            exit 1
          fi
          sha256sum "$APK_PATH"

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NitchesHorizonNative-apk
          path: ${{ env.APK_PATH }}
          retention-days: 90
          if-no-files-found: error
