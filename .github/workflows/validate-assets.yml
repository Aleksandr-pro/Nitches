name: Validate 3D assets

on:
  pull_request:
    paths:
      - '.env.example'
      - '.gitattributes'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/cloud-assets-bundle.yml'
      - '.github/workflows/validate-assets.yml'
      - 'asset-source/**'
      - 'docs/ASSET_PIPELINE.md'
      - 'docs/CLOUD_ASSETS.md'
      - 'docs/CLOUD_ASSETS_PLAN.md'
      - 'docs/PHYSICS_V2.md'
      - 'docs/WORLD_REBUILD_PLAN.md'
      - 'package-lock.json'
      - 'package.json'
      - 'public/assets/models/**'
      - 'scripts/build-cloud-catalog.mjs'
      - 'scripts/check-lfs-assets.mjs'
      - 'scripts/generate-cloud-prototype-tree.mjs'
      - 'scripts/generate-pipeline-smoke-glb.mjs'
      - 'scripts/validate-cloud-catalog.mjs'
      - 'scripts/validate-glb-loader.mjs'
      - 'src/cloudPrototype.js'
      - 'src/main.js'
      - 'src/mustang.js'
      - 'src/resources/**'
      - 'src/vehicle/**'
      - 'tests/resources/**'
      - 'tests/vehicle/**'
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.env.example'
      - '.gitattributes'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/cloud-assets-bundle.yml'
      - '.github/workflows/validate-assets.yml'
      - 'asset-source/**'
      - 'docs/ASSET_PIPELINE.md'
      - 'docs/CLOUD_ASSETS.md'
      - 'docs/CLOUD_ASSETS_PLAN.md'
      - 'docs/PHYSICS_V2.md'
      - 'docs/WORLD_REBUILD_PLAN.md'
      - 'package-lock.json'
      - 'package.json'
      - 'public/assets/models/**'
      - 'scripts/build-cloud-catalog.mjs'
      - 'scripts/check-lfs-assets.mjs'
      - 'scripts/generate-cloud-prototype-tree.mjs'
      - 'scripts/generate-pipeline-smoke-glb.mjs'
      - 'scripts/validate-cloud-catalog.mjs'
      - 'scripts/validate-glb-loader.mjs'
      - 'src/cloudPrototype.js'
      - 'src/main.js'
      - 'src/mustang.js'
      - 'src/resources/**'
      - 'src/vehicle/**'
      - 'tests/resources/**'
      - 'tests/vehicle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Clean LFS checkout, web build and Capacitor sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXTURE: public/assets/models/_pipeline/pipeline-smoke.glb
      VITE_ASSET_CDN_BASE_URL: ${{ vars.VITE_ASSET_CDN_BASE_URL }}
    steps:
      - name: Checkout (runtime LFS assets are pulled explicitly below)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch and verify runtime Git LFS assets
        run: |
          git lfs version
          git lfs install --local
          # Editable packages in asset-source/ may be hundreds of MB and are
          # not needed for a game build; only shipped runtime models are
          # materialized here. The checker still fails on any public pointer.
          git lfs pull --include="public/assets/models/**" --exclude=""
          git lfs ls-files
          node scripts/check-lfs-assets.mjs

      - name: Verify pipeline fixture is byte-identical to its generator
        run: |
          mkdir -p "$RUNNER_TEMP/expected"
          node scripts/generate-pipeline-smoke-glb.mjs "$RUNNER_TEMP/expected/pipeline-smoke.glb"
          cmp "$FIXTURE" "$RUNNER_TEMP/expected/pipeline-smoke.glb"
          sha256sum "$FIXTURE" "$RUNNER_TEMP/expected/pipeline-smoke.glb"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Test cloud resource client and staging bundle
        run: |
          npm test
          npm run cloud:bundle

      - name: Parse runtime car GLBs with Three.js GLTFLoader
        run: |
          shopt -s globstar nullglob
          for glb in public/assets/models/cars/**/*.glb; do
            echo "Validating $glb"
            node scripts/validate-glb-loader.mjs "$glb"
          done

      - name: Build web game
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify the same real bytes reached dist and Android assets
        run: |
          DIST_FIXTURE="dist/assets/models/_pipeline/pipeline-smoke.glb"
          ANDROID_FIXTURE="android/app/src/main/assets/public/assets/models/_pipeline/pipeline-smoke.glb"
          test -f "$DIST_FIXTURE"
          test -f "$ANDROID_FIXTURE"
          cmp "$FIXTURE" "$DIST_FIXTURE"
          cmp "$FIXTURE" "$ANDROID_FIXTURE"
          sha256sum "$FIXTURE" "$DIST_FIXTURE" "$ANDROID_FIXTURE"
          node scripts/check-lfs-assets.mjs --dist
